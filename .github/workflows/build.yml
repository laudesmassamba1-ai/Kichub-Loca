name: Build APK & Web

# ⚠️ Avant le premier build, ajoute dans ton dépôt GitHub :
#   Settings → Secrets and variables → Actions → New repository secret
#   Nom : SUPABASE_ANON_KEY   Valeur : la clé anon dans ton fichier .env
#   Nom : SUPABASE_URL        Valeur : l'URL du projet Supabase (.env)
# Sans la clé anon, l'app sera générée mais ne pourra pas se connecter.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://kjjjgfskabqbbwodoqhc.supabase.co' }}
  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Récupère le code source
        uses: actions/checkout@v4

      - name: Installation de Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Récupération des dépendances
        run: flutter pub get

      - name: Build iOS (non signé, test personnel)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Empaqueter le .app
        run: |
          cd build/ios/iphoneos && zip -r ../../kichub-loca-ios.app.zip Runner.app

      - name: Upload iOS (.app non signé)
        uses: actions/upload-artifact@v4
        with:
          name: kichub-loca-ios
          path: build/kichub-loca-ios.app.zip

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupère le code source
        uses: actions/checkout@v4

      - name: Configuration Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installation de Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyse statique
        run: flutter analyze

      - name: Récupération des dépendances
        run: flutter pub get

      - name: Build APK Release (Android)
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Build Web Release
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kichub-loca-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: kichub-loca-web
          path: build/web